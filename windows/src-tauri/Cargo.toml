[package]
name = "fleet-windows"
description = "Fleet monitor for Windows (Tauri): one server, agent metrics, Docker, logs, DigitalOcean, alerts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No `[lints] workspace = true`: Tauri's macros expand to `unsafe`.


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
fleet-core-ffi = { path = "../../crates/fleet-core-ffi" }
fleet-core = { workspace = true }
fleet-crypto = { workspace = true }
fleet-do = { path = "../../crates/fleet-do" }
